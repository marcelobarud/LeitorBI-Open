services:
  - type: web
    name: leitorbi-open-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LEITORBI_ENV
        value: production
      - key: LEITORBI_REQUIRE_ORIGIN
        value: "true"
      - key: LEITORBI_MAX_UPLOAD_MB
        value: "10"
      - key: LEITORBI_ENABLE_DOCS
        value: "false"
      - key: LEITORBI_CORS_ORIGINS
        sync: false
